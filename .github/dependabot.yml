version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: '06:00'
      timezone: Europe/Berlin
    rebase-strategy: disabled
    ignore:
      - dependency-name: '@babel/*'
        versions:
          - '^8.0.0'
      - dependency-name: '@types/node'
        versions:
          - '>= 25'
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      babel:
        patterns:
          - '@babel/*'
          - 'browserslist'
        update-types:
          - major
      eslint:
        patterns:
          - '@eslint/*'
          - 'eslint'
          - 'eslint-*'
          - 'typescript-eslint'
        update-types:
          - major
